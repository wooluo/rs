<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高性价比人生指南 · 搜索与收藏</title>
<meta name="description" content="高性价比人生指南：657+ 条长寿防病、省钱理财、法律红线、婚育育儿建议，支持关键词搜索、筛选与收藏。">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon">🧭</span>
    <div class="brand-text">
      <h1>高性价比人生指南</h1>
      <span class="brand-sub">长寿防病 · 省钱理财 · 法律红线 · 婚育育儿</span>
    </div>
  </div>
  <div class="searchwrap">
    <span class="search-icon">🔍</span>
    <input id="q" type="search" placeholder="搜关键词，如：血压 / 睡眠 / 断缴 / 头盔（回车或即时搜索）" autocomplete="off">
    <button id="qClear" class="q-clear" title="清空">×</button>
  </div>
  <button id="favBtn" class="fav-btn" title="只看收藏的条目">
    <span class="fav-star">★</span> 收藏 <span id="favCount" class="fav-count">0</span>
  </button>
</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="side-head">章节</div>
    <nav id="chapterNav"></nav>
  </aside>

  <main class="main">

    <div class="toolbar">
      <div class="ch-select-wrap">
        <select id="chSelect"></select>
      </div>
      <div id="stats" class="stats"></div>
      <div class="tools">
        <button id="pageShareBtn" class="tool-btn" title="复制当前页面链接，发给别人打开就是你现在看到的样子">🔗 分享本页</button>
        <button id="randomBtn" class="tool-btn" title="从当前结果里随机看一条">🎲 随机一条</button>
        <button id="exportBtn" class="tool-btn" title="导出收藏为 Markdown 文件">📄 导出收藏</button>
      </div>
    </div>

    <details class="filters" id="filters" open>
      <summary>筛选 <span id="filterHint" class="filter-hint"></span><span class="caret">▾</span></summary>
      <div class="filter-groups" id="filterGroups"></div>
    </details>

    <details class="ch-intro" id="chIntro" hidden>
      <summary>本章导读</summary>
      <div class="ch-intro-body" id="chIntroBody"></div>
    </details>

    <div id="list" class="list"></div>

    <div id="empty" class="empty" hidden>
      <div class="empty-icon">🫥</div>
      <p id="emptyMsg">没有匹配的条目。</p>
      <button id="resetBtn" class="tool-btn">清除搜索和筛选</button>
    </div>

    <button id="moreBtn" class="more-btn" hidden>加载更多 ▾</button>
    <div id="sentinel"></div>
  </main>
</div>

<footer class="footer">
  <p>共 <b id="totalCount">—</b> 条建议 · 内容来自开源项目
    <a href="https://github.com/eternity4719/HowToLiveBetter" target="_blank" rel="noopener">eternity4719/HowToLiveBetter</a>，
    以 <a href="https://creativecommons.org/licenses/by/4.0/deed.zh" target="_blank" rel="noopener">CC BY 4.0</a> 许可发布。</p>
  <p>本站在原内容基础上重新排版，并增加了搜索、筛选与收藏功能。内容仅供个人参考，不构成医疗、法律或投资建议。</p>
</footer>

<div id="toast" class="toast" hidden></div>

<!-- 条目分享弹出菜单 -->
<div id="sharePop" class="share-pop" hidden>
  <div class="share-pop-title" id="sharePopTitle"></div>
  <button data-act="link">🔗 复制链接</button>
  <button data-act="text">📝 复制文字</button>
  <button data-act="img">🖼 生成分享图片</button>
  <button data-act="sys" id="shareSysBtn" hidden>📲 系统分享…</button>
</div>

<!-- 分享图片预览 -->
<div id="imgModal" class="modal" hidden>
  <div class="modal-panel">
    <div class="modal-head">
      <span>分享图片</span>
      <button class="modal-close" id="imgClose" title="关闭">×</button>
    </div>
    <div class="modal-body"><img id="imgPreview" alt="分享图片预览"></div>
    <div class="modal-actions">
      <a id="imgDownload" class="tool-btn primary" download>⬇ 下载图片</a>
      <button id="imgShare" class="tool-btn" hidden>📲 系统分享图片</button>
    </div>
    <p class="modal-tip">手机上也可以直接长按图片保存或转发</p>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
